# SPDX-License-Identifier: MIT
---
- name: Install distribution resource agents (Zypper)
  community.general.zypper:
    name: "{{ resource_agents_distro_packages }}"
    state: present
    disable_recommends: true
  register: _resource_agents_distro_install
  until: _resource_agents_distro_install is succeeded
  retries: 3
