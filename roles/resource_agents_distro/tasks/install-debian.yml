---
- name: Install distribution resource agents (APT)
  ansible.builtin.apt:
    name: "{{ resource_agents_distro_packages }}"
    state: present
    install_recommends: false
    update_cache: true
  register: _resource_agents_distro_install
  until: _resource_agents_distro_install is succeeded
  retries: 3
