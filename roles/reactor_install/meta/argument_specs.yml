# SPDX-License-Identifier: MIT
---
argument_specs:
  main:
    short_description: Install and configure DRBD Reactor
    description:
      - Install and configure DRBD Reactor.
      - Includes C(linbit.drbd.drbd_install) by default to install DRBD.
    options:
      reactor_install_package_state:
        type: str
        default: present
        choices:
          - latest
          - present
        description:
          - Package state for the DRBD Reactor package.
          - Set C(latest) to check for upgrades.
      reactor_install_drbd:
        type: bool
        default: true
        description:
          - Include C(linbit.drbd.drbd_install) to install DRBD.
          - Set to C(false) when DRBD is already managed by a calling role.
      reactor_install_resource_agents_upstream:
        type: bool
        default: true
        description:
          - Include C(linbit.drbd_reactor.resource_agents_upstream) to install missing OCF resource agents from GitHub.
          - Useful on distributions where the C(resource-agents) package is missing or incomplete.
      reactor_install_scst:
        type: bool
        default: false
        description:
          - Include C(linbit.drbd_reactor.scst_install) to compile and install the SCST iSCSI target from source.
          - Pin the SCST git reference with C(scst_install_version) when needed.
      reactor_install_ganesha:
        type: bool
        default: false
        description:
          - Include C(linbit.drbd_reactor.ganesha_install) to install the NFS-Ganesha userspace NFS server.
          - Pin the CentOS Storage SIG repository version on Enterprise Linux with C(ganesha_install_sig_version) when needed.
      reactor_install_prometheus:
        type: bool
        default: false
        description:
          - Open the firewall for the DRBD Reactor Prometheus exporter.
          - The exporter only listens once a C([[prometheus]]) section exists in
            the DRBD Reactor configuration, so the port stays closed until this
            is set. Enabling it does not configure the plugin itself.
      reactor_install_firewall_rules:
        type: bool
        default: true
        description:
          - Manage firewall rules for the DRBD Reactor Prometheus exporter port.
          - Set C(false) to skip firewall configuration.
          - Has no effect unless C(reactor_install_prometheus) is also set.
      reactor_install_firewalld_zone:
        type: str
        default: ""
        description:
          - firewalld zone to open the Prometheus exporter port in.
          - Empty uses the zone firewalld would pick by itself, which is
            the default zone. Set it when a zone is bound to a source,
            because firewalld matches a source before an interface.
          - Ignored by UFW, which has no zones.
      reactor_install_firewall_ports:
        type: list
        elements: dict
        default:
          - port: "9942"
            proto: tcp
        description:
          - Ports to open in firewalld or UFW for the DRBD Reactor Prometheus exporter.
          - 9942 is the registered port for that exporter and the plugin default.
