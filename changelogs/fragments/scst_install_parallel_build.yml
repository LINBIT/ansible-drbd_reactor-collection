# SPDX-License-Identifier: MIT
---
minor_changes:
  - >
    scst_install - build SCST with every available processor thread instead of a
    single job. Debian stays single-threaded until upstream fixes its job-flag
    detection.
bugfixes:
  - >
    scst_install - skip the Debian package build when its packages already exist,
    matching the Red Hat build, so a re-run that failed after compiling does not
    recompile from scratch.
