minor_changes:
  - >-
    scst_install - new role, moved from ``linbit.linstor.gateway_satellite``, that
    builds and installs the SCST iSCSI target from source with DKMS. It works
    standalone, without DRBD Reactor or LINSTOR. Include it from
    ``reactor_install`` with ``reactor_install_scst: true``.
