---
minor_changes:
  - >-
    resource_agents_upstream - ``resource_agents_upstream_version`` accepts branch
    names and commit SHAs. A branch is refreshed on every run.
  - >-
    resource_agents_upstream - add ``ganesha-nfs`` to the default agent list. It is
    not in an upstream release yet, so it installs only when the version is a
    branch such as ``main``.
  - >-
    resource_agents_upstream - skip agents missing from the selected version with a
    warning instead of failing, so one agent list works across versions.
