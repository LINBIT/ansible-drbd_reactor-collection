---
breaking_changes:
  - >-
    resource_agents_upstream - the default ``resource_agents_upstream_version`` is
    now the latest upstream release instead of ``v4.16.0``. Set it to ``v4.16.0``
    to keep the previous version.
  - >-
    resource_agents_upstream - files are now downloaded from GitHub on the Ansible
    control node and copied to the target nodes, so the control node needs GitHub
    access and the target nodes no longer do. This avoids GitHub rate limits on
    larger clusters.
