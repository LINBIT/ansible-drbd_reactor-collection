---
minor_changes:
  - >-
    reactor_install - optionally open the firewall for the DRBD Reactor
    Prometheus exporter on 9942/tcp with ``reactor_install_prometheus``. The
    exporter only listens once a ``[[prometheus]]`` section exists in the DRBD
    Reactor configuration, so the port stays closed unless the variable is set
    and nothing changes for an existing deployment. Enabling it opens the port,
    it does not configure the plugin.
  - >-
    reactor_install - add a ``reactor_install_firewalld_zone`` variable to
    choose the firewalld zone the Prometheus exporter port is opened in, and a
    ``reactor_install_firewall_rules`` toggle to skip firewall handling
    entirely. Empty, the default, omits the zone argument and firewalld uses the
    default zone. Set it when a zone is bound to a source, because firewalld
    matches a source before an interface and zone drifting was removed in
    firewalld 1.0, so a port opened in the default zone does not apply to
    traffic matched into a source zone. UFW has no zones and ignores the
    setting. This matches the pattern added to the other collections
    (https://github.com/LINBIT/ansible-linstor-collection/issues/2).
